# 端口设置 (默认是 8080)
# server.port=8081

# --- MySQL 数据源配置 ---
# !!! 注意：这里的数据库名已修改为测试数据库 gwy_data_test !!!
spring.datasource.url=jdbc:mysql://localhost:3306/gwy_data?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=gwy_user
spring.datasource.password=123456
# 通常不需要显式指定驱动类名
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# --- JPA 配置 ---
# ddl-auto=update 会在启动时根据实体类更新表结构，用 validate 更安全，none 则不操作
spring.jpa.hibernate.ddl-auto=update
# 在控制台显示 Hibernate 执行的 SQL
spring.jpa.show-sql=true
# 格式化输出的 SQL
spring.jpa.properties.hibernate.format_sql=true
# 指定 MySQL 方言 (适用于 MySQL 8.0+)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 如果是 MySQL 5.7 或更早版本，可能需要使用下面的方言
# spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect

# --- 文件上传配置 ---
# 文件上传目录 (相对于项目根目录的 gwy-uploads 文件夹)
# 生产环境建议使用绝对路径，如 D:/gwy_uploads 或 /var/www/gwy_uploads
file.upload-dir=./gwy-uploads
# --- Spring Boot 默认属性调整 ---
# 单个文件最大大小 (此处设为 20MB)
spring.servlet.multipart.max-file-size=20MB
# 单次请求最大大小 (应略大于 max-file-size，此处设为 21MB)
spring.servlet.multipart.max-request-size=21MB
# 配置 Jackson 处理日期时间的格式
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
# 配置 Jackson 使用的时区 (这里是中国上海时间)
spring.jackson.time-zone=Asia/Shanghai
# (可选) 禁用将日期序列化为时间戳，通常建议禁用以输出标准 ISO 格式
spring.jackson.serialization.write-dates-as-timestamps=false